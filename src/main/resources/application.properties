spring.application.name=ai-rag-demo

# Spring AI 接入 Kimi 配置，Kimi 兼容 OpenAI 接口
# 启动前设置环境变量：MOONSHOT_API_KEY
spring.ai.openai.api-key=${MOONSHOT_API_KEY:}
spring.ai.openai.base-url=https://api.moonshot.cn
spring.ai.openai.chat.options.model=moonshot-v1-8k
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=4096

server.port=8080
